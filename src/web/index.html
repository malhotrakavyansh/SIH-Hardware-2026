<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nakshatra</title>
<style>
  :root{
    --bg: #03050a;
    --accent: #3fe0ff;
    --accent-rgb: 63, 224, 255;
    --accent-dim: #1a6b7a;
    --text: #f2f6fa;
    --text-dim: #9fb0bf;
    --text-muted: #7d8e9e;
    --text-faint: #5f6d7b;
    --ok: #3fe0ff;
    --good: #5ef0a8;
    --warn: #ffc15e;
    --danger: #ff5d6c;

    /* glass panels: dark, heavily blurred, with a lit top edge */
    --glass-bg: rgba(8, 13, 20, 0.68);
    --glass-bg-strong: rgba(5, 9, 15, 0.80);
    --glass-border: rgba(255, 255, 255, 0.09);
    --glass-edge: rgba(255, 255, 255, 0.16);
    /* Backdrop blurs re-run every frame over the animating canvas and their
       cost scales with radius x area, so radii stay modest; the panel
       opacity above carries most of the separation. */
    --glass-blur: blur(14px);
    --glass-blur-strong: blur(20px);
    --glass-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 2px 10px rgba(0, 0, 0, 0.35);

    /* metrics panel width: 256px at 1920 wide, never below 210px */
    --metrics-w: clamp(210px, 13.4vw, 256px);

    /* mouse parallax, written by app.js (px, already scaled) */
    --plx: 0px;
    --ply: 0px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  #scene-canvas {
    position: fixed;
    inset: 0;
    display: block;
    z-index: 0;
  }

  #stage {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  #stage > * { pointer-events: auto; }

  .glass {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px rgba(255,255,255,0.02);
  }

  /* ---------- header ---------- */

  #header {
    position: fixed;
    top: 30px;
    left: 38px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 5;
    translate: calc(var(--plx) * 0.4) calc(var(--ply) * 0.4);
  }

  #header img {
    height: 44px;
    width: auto;
    opacity: 0.9;
    filter: drop-shadow(0 0 10px rgba(0,0,0,0.7));
  }

  #header .wordmark {
    font-size: 16px;
    letter-spacing: 0.32em;
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
  }

  /* ---------- connection banner ---------- */

  #conn-banner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    text-align: center;
    padding: 9px 0;
    font-size: 14px;
    letter-spacing: 0.05em;
    background: rgba(255, 93, 108, 0.16);
    color: #ffb2ba;
    border-bottom: 1px solid rgba(255, 93, 108, 0.3);
    backdrop-filter: blur(10px);
    transform: translateY(-100%);
    transition: transform 0.35s ease;
  }

  #conn-banner.show { transform: translateY(0); }

  /* ---------- main column ----------
     One centred column: status chip, transcript, card. When the card is
     hidden it takes no space, so the transcript sits dead centre; when the
     card appears the transcript is pushed up (animated FLIP in app.js) and
     both stay on screen together -- what was said above what it resolved to. */

  #main {
    position: fixed;
    inset: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.2vh;
    /* side padding reserves the metrics panel's column on BOTH sides so the
       content stays centred on screen and never slides under the panel */
    padding: 108px calc(var(--metrics-w) + 44px) 56px;
    pointer-events: none;
  }

  #main > * { pointer-events: auto; }

  /* ---------- status chip ---------- */

  #status-label {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 10px 22px 10px 18px;
    border-radius: 40px;
    transition: color 0.3s ease, border-color 0.3s ease;
    translate: calc(var(--plx) * 0.9) calc(var(--ply) * 0.9);
  }

  #status-label .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 10px currentColor;
    animation: dot-breathe 2.4s ease-in-out infinite;
  }

  #status-label.wake { color: var(--accent); border-color: rgba(var(--accent-rgb), 0.35); }
  #status-label.matched { color: var(--good); border-color: rgba(94, 240, 168, 0.35); }

  @keyframes dot-breathe {
    0%, 100% { opacity: 0.45; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  /* ---------- idle ---------- */

  #idle-block {
    text-align: center;
    translate: calc(var(--plx) * 0.9) calc(var(--ply) * 0.9);
  }

  #idle-pulse {
    font-size: 5.4vh;
    font-weight: 300;
    letter-spacing: 0.01em;
    color: var(--text);
    text-shadow: 0 2px 30px rgba(0,0,0,0.8);
    animation: pulse 3.2s ease-in-out infinite;
  }

  #idle-pulse b {
    font-weight: 600;
    color: #fff;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.75; }
    50% { opacity: 1; }
  }

  #level-wrap {
    margin: 3.2vh auto 0;
    width: 360px;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }

  #level-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    opacity: 0.75;
    transition: width 0.08s linear;
  }

  /* ---------- transcript: the centrepiece ---------- */

  #transcript-panel {
    --tier: 8.1;      /* font size in vh, set per text length by app.js */
    --tmul: 1;        /* 0.78 when paired with the mission card */
    position: relative;
    max-width: 100%;
    min-width: min(620px, 100%);
    padding: 2.3vh 3.4vh 2.7vh;
    border-radius: 22px;
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-blur-strong);
    -webkit-backdrop-filter: var(--glass-blur-strong);
    box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-edge);
    text-align: center;
    overflow: hidden;
    translate: calc(var(--plx) * 1.0) calc(var(--ply) * 1.0);
    transition: border-color 0.5s ease, box-shadow 0.5s ease;
  }

  #transcript-panel[hidden] { display: none; }

  #transcript-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 1.1vh;
    transition: color 0.4s ease;
  }

  #transcript-label .tl-icon {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  #transcript-label .tl-pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: dot-breathe 1.1s ease-in-out infinite;
  }

  #transcript-label svg { display: none; }

  #transcript-text {
    font-size: max(34px, calc(var(--tier) * var(--tmul) * 1vh));
    font-weight: 500;
    line-height: 1.16;
    letter-spacing: -0.005em;
    color: var(--text-muted);
    min-height: 1.16em;
    overflow-wrap: anywhere;
    text-wrap: balance;
  }

  #transcript-text .word {
    display: inline-block;
    opacity: 0;
    transform: translateY(0.18em);
    animation: word-in 0.3s ease forwards;
    transition: color 0.45s ease, text-shadow 0.6s ease;
  }

  @keyframes word-in {
    to { opacity: 1; transform: translateY(0); }
  }

  #transcript-text .waiting {
    color: var(--text-faint);
    font-weight: 300;
  }

  #transcript-text .waiting i {
    font-style: normal;
    display: inline-block;
    animation: dot-breathe 1.2s ease-in-out infinite;
  }
  #transcript-text .waiting i:nth-child(2) { animation-delay: 0.2s; }
  #transcript-text .waiting i:nth-child(3) { animation-delay: 0.4s; }

  /* confirmed: text goes full white, the panel edge lights up, a light sweep
     crosses the block once and the label flips to a check -- reads as "locked
     in", not just a colour change */
  #transcript-panel.locked {
    border-color: rgba(var(--accent-rgb), 0.55);
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(var(--accent-rgb), 0.5),
                0 0 0 1px rgba(var(--accent-rgb), 0.18), 0 0 46px rgba(var(--accent-rgb), 0.16);
  }

  #transcript-panel.locked #transcript-text { color: var(--text); }
  #transcript-panel.locked #transcript-text .word {
    color: var(--text);
    text-shadow: 0 0 24px rgba(var(--accent-rgb), 0.18);
  }

  #transcript-panel.locked #transcript-label { color: var(--accent); }
  #transcript-panel.locked #transcript-label .tl-pulse { display: none; }
  #transcript-panel.locked #transcript-label svg { display: block; }

  #transcript-panel::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 20%, rgba(var(--accent-rgb), 0.20) 45%,
                rgba(255,255,255,0.28) 50%, rgba(var(--accent-rgb), 0.20) 55%, transparent 80%);
    transform: translateX(-110%);
    pointer-events: none;
    opacity: 0;
  }

  #transcript-panel.sweep::after {
    animation: sweep 0.9s cubic-bezier(0.3, 0.6, 0.3, 1) forwards;
  }

  @keyframes sweep {
    0% { transform: translateX(-110%); opacity: 1; }
    100% { transform: translateX(110%); opacity: 1; }
  }

  #transcript-panel.settle #transcript-text {
    animation: settle 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  @keyframes settle {
    0% { transform: scale(1.035); }
    100% { transform: scale(1); }
  }

  #transcript-panel.paired { --tmul: 0.74; padding: 1.7vh 3vh 2vh; }
  #transcript-panel.paired #transcript-label { margin-bottom: 0.7vh; }

  /* ---------- mission card ---------- */

  #card-wrap {
    width: min(1320px, 100%);
    perspective: 1600px;
    perspective-origin: 50% 0%;
    translate: calc(var(--plx) * 1.25) calc(var(--ply) * 1.25);
  }

  #card-wrap[hidden] { display: none; }

  /* The card is the largest panel (~1320x600) and a backdrop blur that size
     re-runs every frame over the animating scene -- on the demo laptop's
     integrated GPU it alone dropped CONTENT to ~30fps. It sits over the
     planet's dark night side, so near-opaque glass with the same edge
     highlight reads the same without the per-frame blur. */
  .card.glass {
    background: rgba(6, 10, 16, 0.9);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }

  .card {
    display: flex;
    gap: 3.4vh;
    align-items: stretch;
    border-radius: 22px;
    padding: 3vh;
    opacity: 0;
    transform: translate3d(0, 160px, -700px) rotateX(24deg);
    transform-origin: 50% 100%;
    transition: opacity 0.55s ease, transform 1.05s cubic-bezier(0.22, 1, 0.36, 1);
  }

  #card-wrap.show .card {
    opacity: 1;
    transform: translate3d(0, 0, 0) rotateX(0deg);
  }

  #card-wrap.leaving .card {
    opacity: 0;
    transform: translate3d(0, 40px, -200px) rotateX(8deg);
    transition: opacity 0.35s ease, transform 0.45s ease-in;
  }

  /* image: a dark instrument-style frame. The image is never upscaled past
     its natural size (max-* only), so a 529x378 JPEG stays crisp and sits
     in the frame deliberately; a blurred copy fills the backing so the
     empty space reads as part of the design. */
  .card-image {
    flex: 0 0 42%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 42vh;
    max-height: 460px;
    border-radius: 16px;
    background: #04070c;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.06);
    overflow: hidden;
    padding: 3.2vh;
  }

  .card-image .ambient {
    position: absolute;
    inset: -30px;
    background-size: cover;
    background-position: center;
    filter: blur(28px) saturate(120%);
    opacity: 0.32;
    transform: scale(1.1);
  }

  .card-image .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(var(--accent-rgb), 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--accent-rgb), 0.05) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(ellipse at center, transparent 35%, #000 90%);
    -webkit-mask-image: radial-gradient(ellipse at center, transparent 35%, #000 90%);
  }

  .card-image .corner {
    position: absolute;
    width: 22px;
    height: 22px;
    border-color: rgba(var(--accent-rgb), 0.7);
    border-style: solid;
    border-width: 0;
  }
  .card-image .corner.tl { top: 12px; left: 12px; border-top-width: 2px; border-left-width: 2px; }
  .card-image .corner.tr { top: 12px; right: 12px; border-top-width: 2px; border-right-width: 2px; }
  .card-image .corner.bl { bottom: 12px; left: 12px; border-bottom-width: 2px; border-left-width: 2px; }
  .card-image .corner.br { bottom: 12px; right: 12px; border-bottom-width: 2px; border-right-width: 2px; }

  .card-image img {
    position: relative;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.10);
    opacity: 0;
    transform: scale(0.96);
    transition: opacity 0.6s ease 0.25s, transform 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
  }

  #card-wrap.show .card-image img { opacity: 1; transform: scale(1); }

  /* no photo yet: orbit emblem + name + status, styled to match the frame */
  .card-image .no-photo {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2vh;
    text-align: center;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at 50% 40%, rgba(var(--accent-rgb), 0.10), transparent 65%);
  }

  .no-photo .np-emblem {
    position: relative;
    width: 15vh;
    height: 15vh;
  }

  .no-photo .np-body {
    position: absolute;
    inset: 30%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5fd4f5, #1a5f86 55%, #08192a 100%);
    box-shadow: 0 0 40px rgba(var(--accent-rgb), 0.35);
  }

  .no-photo .np-orbit {
    position: absolute;
    inset: 4% -8%;
    border-radius: 50%;
    border: 1.5px solid rgba(var(--accent-rgb), 0.55);
    transform: rotate(-18deg) scaleY(0.42);
  }

  .no-photo .np-sat {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #dff8ff;
    box-shadow: 0 0 12px #bff4ff;
    left: 88%;
    top: 36%;
  }

  .no-photo .np-name {
    font-size: 3.6vh;
    font-weight: 600;
    color: #fff;
    line-height: 1.15;
    max-width: 90%;
  }

  .no-photo .np-status {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.85;
  }

  .card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: left;
    min-width: 0;
    gap: 1.6vh;
  }

  .card-body > * {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #card-wrap.show .card-body > * { opacity: 1; transform: none; }
  #card-wrap.show .card-body > *:nth-child(1) { transition-delay: 0.22s; }
  #card-wrap.show .card-body > *:nth-child(2) { transition-delay: 0.30s; }
  #card-wrap.show .card-body > *:nth-child(3) { transition-delay: 0.38s; }
  #card-wrap.show .card-body > *:nth-child(4) { transition-delay: 0.46s; }
  #card-wrap.show .card-body > *:nth-child(5) { transition-delay: 0.54s; }

  .card-kicker {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.85;
  }

  .card-name {
    font-size: 5.2vh;
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: #fff;
    margin-top: -0.6vh;
  }

  .card-meta {
    display: flex;
    gap: 3vh;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .meta-field .mf-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 6px;
  }

  .meta-field .mf-value {
    font-size: 2.4vh;
    font-weight: 500;
    color: var(--text);
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 2.1vh;
    font-weight: 600;
    padding: 6px 16px 6px 12px;
    border-radius: 30px;
    color: var(--accent);
    background: rgba(var(--accent-rgb), 0.10);
    border: 1px solid rgba(var(--accent-rgb), 0.45);
  }

  .status-pill::before {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 10px currentColor;
  }

  .status-pill.good { color: var(--good); background: rgba(94,240,168,0.10); border-color: rgba(94,240,168,0.45); }
  .status-pill.warn { color: var(--warn); background: rgba(255,193,94,0.10); border-color: rgba(255,193,94,0.45); }

  .status-detail {
    font-size: 15px;
    color: var(--text-dim);
    margin-top: 7px;
    max-width: 420px;
  }

  .card-oneline {
    font-size: 2.2vh;
    color: #c9d4de;
    line-height: 1.45;
  }

  .card-facts {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.9vh;
  }

  .card-facts li {
    font-size: 1.8vh;
    color: var(--text-dim);
    line-height: 1.45;
    padding-left: 20px;
    position: relative;
  }

  .card-facts li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.62em;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    opacity: 0.85;
  }

  .card-confidence {
    font-size: 13px;
    color: var(--text-faint);
    letter-spacing: 0.04em;
  }

  /* no-match card */

  .card.no-match {
    justify-content: center;
    align-items: center;
    text-align: center;
    flex-direction: column;
    gap: 14px;
    padding: 4.5vh;
  }

  .card.no-match .nm-title {
    font-size: 3.4vh;
    color: var(--text);
    font-weight: 500;
  }

  .card.no-match .nm-hint {
    font-size: 2vh;
    color: var(--text-dim);
  }

  /* ---------- metrics panel ---------- */

  /* The judged metrics -- always visible on laptop-class viewports, including
     1920x1080 at 150% Windows scaling (a 1280x720 CSS viewport). Width scales
     with the viewport; #main reserves the same column. */
  #metrics {
    position: fixed;
    right: 24px;
    top: 50%;
    width: var(--metrics-w);
    z-index: 8;
    border-radius: 16px;
    padding: 20px 18px 18px;
    transform: translateY(-50%);
    translate: calc(var(--plx) * 0.7) calc(var(--ply) * 0.7);
  }

  #metrics .m-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }

  #metrics .m-row.stack {
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }

  #metrics .m-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  #metrics .m-value {
    font-size: 13px;
    color: var(--text);
  }

  #headline-latency {
    text-align: center;
    padding: 8px 0 14px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--glass-border);
  }

  #headline-latency .hl-value {
    font-size: 36px;
    color: var(--accent);
    line-height: 1;
    text-shadow: 0 0 20px rgba(var(--accent-rgb), 0.35);
  }

  #headline-latency .hl-unit {
    font-size: 13px;
    color: var(--text-faint);
    margin-left: 4px;
  }

  #headline-latency .hl-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-top: 6px;
  }

  #waterfall { margin: 4px 0 14px; }

  #waterfall .wf-bar {
    display: flex;
    height: 8px;
    width: 100%;
    border-radius: 4px;
    overflow: hidden;
    background: rgba(255,255,255,0.06);
  }

  #waterfall .wf-seg {
    height: 100%;
    position: relative;
    cursor: default;
  }

  #waterfall .wf-seg[data-seg="t1t2"] { background: var(--accent); }
  #waterfall .wf-seg[data-seg="t2t3"] { background: #7aa8ff; }
  #waterfall .wf-seg[data-seg="t3t4"] { background: #b38dff; }
  #waterfall .wf-seg[data-seg="t4t5"] { background: #ff9d6c; }

  #waterfall .wf-seg:hover::after {
    content: attr(data-tip);
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: #0c1218;
    border: 1px solid var(--glass-border);
    color: var(--text);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
    z-index: 10;
  }

  #edge-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
    background: var(--danger);
    box-shadow: 0 0 6px currentColor;
  }

  #edge-dot.connected { background: var(--ok); }

  #metrics .m-row:last-child { margin-bottom: 0; }

  /* ---------- reduced motion ---------- */

  @media (prefers-reduced-motion: reduce) {
    #idle-pulse, #status-label .dot, #transcript-label .tl-pulse, #transcript-text .waiting i { animation: none; }
    #transcript-text .word { animation: none; opacity: 1; transform: none; }
    #transcript-panel.settle #transcript-text, #transcript-panel.sweep::after { animation: none; }
    .card, .card-body > *, .card-image img { transition: opacity 0.3s ease; transform: none !important; }
  }

  @media (max-width: 1000px) {
    #main { padding-left: 32px; padding-right: 32px; }
    #metrics { display: none; }
  }

  @media (max-width: 900px) {
    .card { flex-direction: column; }
    .card-image { flex: none; height: 30vh; }
  }
</style>
</head>
<body>

  <canvas id="scene-canvas"></canvas>

  <div id="conn-banner">reconnecting to server&hellip;</div>

  <div id="stage">
    <div id="header">
      <img src="/assets/isro/isro-logo.png" alt="" onerror="this.style.display='none'">
      <div class="wordmark">Nakshatra</div>
    </div>

    <div id="main">
      <div id="status-label" class="glass"><span class="dot"></span><span id="status-text">Listening</span></div>

      <div id="idle-block">
        <div id="idle-pulse">Listening for <b>Nakshatra</b></div>
        <div id="level-wrap"><div id="level-bar"></div></div>
      </div>

      <div id="transcript-panel" hidden>
        <div id="transcript-label">
          <span class="tl-icon">
            <span class="tl-pulse"></span>
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 9.3l2.6 2.6L13 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span id="transcript-label-text">Hearing</span>
        </div>
        <div id="transcript-text"></div>
      </div>

      <div id="card-wrap" hidden>
        <div id="card-slot"></div>
      </div>
    </div>

    <div id="metrics" class="glass">
      <div id="headline-latency">
        <div class="hl-value mono"><span id="hl-ms">&mdash;</span><span class="hl-unit">ms</span></div>
        <div class="hl-label">wake &rarr; server (T2&minus;T1)</div>
      </div>

      <div id="waterfall">
        <div class="wf-bar" id="wf-bar"></div>
      </div>

      <div class="m-row">
        <span class="m-label">Wake confidence</span>
        <span class="m-value mono" id="m-confidence">&mdash;</span>
      </div>
      <div class="m-row stack">
        <span class="m-label">Model</span>
        <span class="m-value mono"><span style="white-space:nowrap">44 KB INT8 /</span> <span style="white-space:nowrap">22.6K params</span></span>
      </div>
      <div class="m-row">
        <span class="m-label">Detections</span>
        <span class="m-value mono" id="m-count">0</span>
      </div>
      <div class="m-row">
        <span class="m-label">Edge</span>
        <span class="m-value mono"><span id="edge-dot"></span><span id="edge-text">unknown</span></span>
      </div>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
